<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - Modern Furniture Store</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/colors.css" />
    <link rel="stylesheet" href="../assets/css/admin/admin.css" />
  </head>
  <body>
    <div class="admin-wrapper">
      <!-- Sidebar -->
      <nav class="admin-sidebar">
        <a class="navbar-brand" href="index.html">
          <i class="fas fa-chair"></i> Admin
        </a>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="index.html">
              <i class="fas fa-tachometer-alt"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html">
              <i class="fas fa-box"></i> Products
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="orders.html">
              <i class="fas fa-shopping-cart"></i> Orders
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="users.html">
              <i class="fas fa-users"></i> Users
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="reviews.html">
              <i class="fas fa-star"></i> Reviews
            </a>
          </li>
          <li class="nav-item mt-4">
            <a class="nav-link" href="../index.html">
              <i class="fas fa-sign-out-alt"></i> Exit Admin
            </a>
          </li>
        </ul>
      </nav>

      <!-- Main Content -->
      <main class="admin-main">
        <!-- Header -->
        <header class="admin-header">
          <h1 class="h3 m-0">User Management</h1>
          <button
            class="admin-btn admin-btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#addUserModal"
          >
            <i class="fas fa-user-plus"></i> Add New User
          </button>
        </header>

        <!-- User Filters -->
        <div class="admin-card mb-4">
          <div class="row g-3">
            <div class="col-md-3">
              <select class="admin-form-control">
                <option value="">Filter by Role</option>
                <option value="customer">Customer</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="admin-form-control">
                <option value="">Filter by Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="blocked">Blocked</option>
              </select>
            </div>
            <div class="col-md-4">
              <input
                type="text"
                class="admin-form-control"
                placeholder="Search Users..."
              />
            </div>
            <div class="col-md-2">
              <button class="admin-btn admin-btn-primary w-100">
                Apply Filters
              </button>
            </div>
          </div>
        </div>

        <!-- Users Table -->
        <div class="admin-card">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Joined Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>#001</td>
                  <td>John Doe</td>
                  <td>john@example.com</td>
                  <td>Customer</td>
                  <td>June 1, 2025</td>
                  <td><span class="badge bg-success">Active</span></td>
                  <td>
                    <button
                      class="admin-btn admin-btn-warning btn-sm"
                      data-bs-toggle="modal"
                      data-bs-target="#editUserModal"
                    >
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="admin-btn admin-btn-danger btn-sm">
                      <i class="fas fa-ban"></i>
                    </button>
                  </td>
                </tr>
                <tr>
                  <td>#002</td>
                  <td>Jane Smith</td>
                  <td>jane@example.com</td>
                  <td>Admin</td>
                  <td>May 15, 2025</td>
                  <td><span class="badge bg-success">Active</span></td>
                  <td>
                    <button
                      class="admin-btn admin-btn-warning btn-sm"
                      data-bs-toggle="modal"
                      data-bs-target="#editUserModal"
                    >
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="admin-btn admin-btn-danger btn-sm">
                      <i class="fas fa-ban"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add New User</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="admin-form-group">
                <label class="admin-form-label">Full Name</label>
                <input type="text" class="admin-form-control" required />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Email</label>
                <input type="email" class="admin-form-control" required />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Password</label>
                <input type="password" class="admin-form-control" required />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Role</label>
                <select class="admin-form-control" required>
                  <option value="customer">Customer</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="admin-btn admin-btn-secondary btn-sm"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="admin-btn admin-btn-primary btn-sm">
              Add User
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit User Modal -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit User</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="admin-form-group">
                <label class="admin-form-label">Full Name</label>
                <input
                  type="text"
                  class="admin-form-control"
                  value="John Doe"
                  required
                />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Email</label>
                <input
                  type="email"
                  class="admin-form-control"
                  value="john@example.com"
                  required
                />
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Role</label>
                <select class="admin-form-control" required>
                  <option value="customer" selected>Customer</option>
                  <option value="admin">Admin</option>
                </select>
              </div>
              <div class="admin-form-group">
                <label class="admin-form-label">Status</label>
                <select class="admin-form-control" required>
                  <option value="active" selected>Active</option>
                  <option value="inactive">Inactive</option>
                  <option value="blocked">Blocked</option>
                </select>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="admin-btn admin-btn-secondary btn-sm"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="admin-btn admin-btn-primary btn-sm">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
